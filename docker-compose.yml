services:
  postgres:
    image: postgres:16-alpine
    container_name: weather-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weather_alerts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_alerts"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: weather-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  weather-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - .env.smtp
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/weather_alerts
      LOGGING_FILE_NAME: /app/logs/weather-alert-backend.log
    ports:
      - "8088:8080"
    volumes:
      - ./logs:/app/logs

  zipkin:
    image: openzipkin/zipkin:3.5.1
    container_name: weather-zipkin
    profiles: ["observability"]
    ports:
      - "9411:9411"

  loki:
    image: grafana/loki:3.0.0
    container_name: weather-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.0.0
    container_name: weather-promtail
    profiles: ["observability"]
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/weather-app:ro

  grafana:
    image: grafana/grafana:10.4.3
    container_name: weather-grafana
    profiles: ["observability"]
    depends_on:
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres_data:
  grafana_data:
