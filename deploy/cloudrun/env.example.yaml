# Cloud Run environment variables for the backend service.
# Do not commit real secrets to this repository.

# Cloud SQL for PostgreSQL via the Cloud SQL Java connector
SPRING_DATASOURCE_URL: "jdbc:postgresql:///weather_alerts"
SPRING_DATASOURCE_USERNAME: "weather_app"
SPRING_DATASOURCE_PASSWORD: "replace-me"
SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_SOCKET_FACTORY: "com.google.cloud.sql.postgres.SocketFactory"
SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_CLOUD_SQL_INSTANCE: "your-project-id:us-east1:weather-alert-db"
SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_IP_TYPES: "PUBLIC,PRIVATE"
SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_CLOUD_SQL_REFRESH_STRATEGY: "lazy"

# Managed Kafka example values
SPRING_KAFKA_BOOTSTRAP_SERVERS: "pkc-xxxxx.us-east1.gcp.confluent.cloud:9092"
SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "SASL_SSL"
SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: "PLAIN"
SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username='replace-me' password='replace-me';"

# Managed Elasticsearch example values
SPRING_ELASTICSEARCH_URIS: "https://cluster-id.us-east1.gcp.cloud.es.io:443"
SPRING_ELASTICSEARCH_USERNAME: "elastic"
SPRING_ELASTICSEARCH_PASSWORD: "replace-me"

# Application auth and security
APP_SECURITY_USER_USERNAME: "weather-user"
APP_SECURITY_USER_PASSWORD: "replace-me"
APP_SECURITY_ADMIN_USERNAME: "weather-admin"
APP_SECURITY_ADMIN_PASSWORD: "replace-me"
APP_SECURITY_JWT_SECRET: "replace-with-at-least-32-characters"

# Email delivery
APP_NOTIFICATION_EMAIL_PROVIDER: "smtp"
SPRING_MAIL_HOST: "smtp.example.com"
SPRING_MAIL_PORT: "587"
SPRING_MAIL_USERNAME: "smtp-user"
SPRING_MAIL_PASSWORD: "replace-me"
SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
APP_NOTIFICATION_EMAIL_FROM_ADDRESS: "no-reply@example.com"

# App behavior
APP_AUTH_RECOVERY_FRONTEND_BASE_URL: "https://your-frontend.example.com"
APP_NOTIFICATION_VERIFICATION_SEND_EMAIL: "true"
APP_AUTH_RECOVERY_SEND_EMAIL: "true"
APP_NOTIFICATION_CRITERIA_CREATED_SEND_EMAIL: "true"
APP_NOTIFICATION_CRITERIA_DELETED_SEND_EMAIL: "true"
APP_NOTIFICATION_DELIVERY_WORKER_ENABLED: "true"
LOGGING_FILE_NAME: "/tmp/weather-alert-backend.log"
MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
