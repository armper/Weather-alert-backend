spring:
  application:
    name: weather-alert-backend
    
  datasource:
    url: jdbc:postgresql://localhost:5432/weather_alerts
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
        
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
          ssl:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:false}
            trust: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}
    
server:
  port: 8080
  
logging:
  file:
    name: ${LOGGING_FILE_NAME:logs/weather-alert-backend.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOGGING_FILE_NAME:logs/weather-alert-backend.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB
  pattern:
    correlation: "[traceId=%X{traceId:-},spanId=%X{spanId:-},correlationId=%X{correlationId:-}] "
  level:
    com.weather.alert: INFO
    org.springframework.web: INFO
    org.hibernate: WARN

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    persist-authorization: true

app:
  weather:
    processing:
      schedule-enabled: ${APP_WEATHER_PROCESSING_SCHEDULE_ENABLED:true}
      fixed-delay-ms: ${APP_WEATHER_PROCESSING_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${APP_WEATHER_PROCESSING_INITIAL_DELAY_MS:30000}
  noaa:
    # NOAA /alerts/active responses can exceed WebClient's default 256KB buffer
    max-in-memory-size: ${APP_NOAA_MAX_IN_MEMORY_SIZE:10MB}
    request-timeout-seconds: ${APP_NOAA_REQUEST_TIMEOUT_SECONDS:8}
    retry-max-attempts: ${APP_NOAA_RETRY_MAX_ATTEMPTS:2}
    retry-backoff-millis: ${APP_NOAA_RETRY_BACKOFF_MILLIS:250}
    min-request-interval-millis: ${APP_NOAA_MIN_REQUEST_INTERVAL_MILLIS:150}
    outage-failure-threshold: ${APP_NOAA_OUTAGE_FAILURE_THRESHOLD:4}
    outage-open-seconds: ${APP_NOAA_OUTAGE_OPEN_SECONDS:30}
  nwps:
    max-in-memory-size: ${APP_NWPS_MAX_IN_MEMORY_SIZE:4MB}
    request-timeout-seconds: ${APP_NWPS_REQUEST_TIMEOUT_SECONDS:${APP_NOAA_REQUEST_TIMEOUT_SECONDS:8}}
    retry-max-attempts: ${APP_NWPS_RETRY_MAX_ATTEMPTS:${APP_NOAA_RETRY_MAX_ATTEMPTS:2}}
    retry-backoff-millis: ${APP_NWPS_RETRY_BACKOFF_MILLIS:${APP_NOAA_RETRY_BACKOFF_MILLIS:250}}
    min-request-interval-millis: ${APP_NWPS_MIN_REQUEST_INTERVAL_MILLIS:200}
    outage-failure-threshold: ${APP_NWPS_OUTAGE_FAILURE_THRESHOLD:4}
    outage-open-seconds: ${APP_NWPS_OUTAGE_OPEN_SECONDS:30}
  rate-limit:
    max-requests: 120
    window-seconds: 60
    trust-forwarded-for: false
  retention:
    schedule-enabled: ${APP_RETENTION_SCHEDULE_ENABLED:true}
    enabled: ${APP_RETENTION_ENABLED:true}
    alerts-days: ${APP_RETENTION_ALERTS_DAYS:2}
    weather-data-hours: ${APP_RETENTION_WEATHER_DATA_HOURS:72}
    criteria-state-days: ${APP_RETENTION_CRITERIA_STATE_DAYS:14}
    cleanup-orphan-criteria-state: ${APP_RETENTION_CLEANUP_ORPHAN_CRITERIA_STATE:true}
    cleanup-fixed-delay-ms: ${APP_RETENTION_CLEANUP_FIXED_DELAY_MS:3600000}
    cleanup-initial-delay-ms: ${APP_RETENTION_CLEANUP_INITIAL_DELAY_MS:120000}
  security:
    user:
      username: ${APP_SECURITY_USER_USERNAME}
      password: ${APP_SECURITY_USER_PASSWORD}
    admin:
      username: ${APP_SECURITY_ADMIN_USERNAME}
      password: ${APP_SECURITY_ADMIN_PASSWORD}
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      # JWT lifetime in seconds (default 3600 = 1 hour)
      expiration-seconds: ${APP_SECURITY_JWT_EXPIRATION_SECONDS:3600}
  admin:
    jobs:
      token: ${APP_ADMIN_JOBS_TOKEN:}
  notification:
    delivery:
      worker-enabled: ${APP_NOTIFICATION_DELIVERY_WORKER_ENABLED:true}
      retry-poller-enabled: ${APP_NOTIFICATION_DELIVERY_RETRY_POLLER_ENABLED:true}
      max-attempts: ${APP_NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
      retry-base-seconds: ${APP_NOTIFICATION_DELIVERY_RETRY_BASE_SECONDS:30}
      retry-max-seconds: ${APP_NOTIFICATION_DELIVERY_RETRY_MAX_SECONDS:900}
      retry-poller-fixed-delay-ms: ${APP_NOTIFICATION_DELIVERY_RETRY_POLLER_FIXED_DELAY_MS:10000}
      retry-poller-initial-delay-ms: ${APP_NOTIFICATION_DELIVERY_RETRY_POLLER_INITIAL_DELAY_MS:15000}
      retry-poller-batch-size: ${APP_NOTIFICATION_DELIVERY_RETRY_POLLER_BATCH_SIZE:100}
    email:
      provider: ${APP_NOTIFICATION_EMAIL_PROVIDER:smtp}
      from-address: ${APP_NOTIFICATION_EMAIL_FROM_ADDRESS:no-reply@weather-alert.local}
      reply-to-address: ${APP_NOTIFICATION_EMAIL_REPLY_TO_ADDRESS:}
      ses:
        region: ${APP_NOTIFICATION_EMAIL_SES_REGION:us-east-1}
    sms:
      provider: ${APP_NOTIFICATION_SMS_PROVIDER:noop}
      from-number: ${APP_NOTIFICATION_SMS_FROM_NUMBER:}
      messaging-service-sid: ${APP_NOTIFICATION_SMS_MESSAGING_SERVICE_SID:}
      twilio:
        account-sid: ${APP_NOTIFICATION_SMS_TWILIO_ACCOUNT_SID:}
        auth-token: ${APP_NOTIFICATION_SMS_TWILIO_AUTH_TOKEN:}
        api-key: ${APP_NOTIFICATION_SMS_TWILIO_API_KEY:}
        api-secret: ${APP_NOTIFICATION_SMS_TWILIO_API_SECRET:}
    verification:
      token-ttl-minutes: ${APP_NOTIFICATION_VERIFICATION_TOKEN_TTL_MINUTES:15}
      expose-raw-token: ${APP_NOTIFICATION_VERIFICATION_EXPOSE_RAW_TOKEN:false}
      send-email: ${APP_NOTIFICATION_VERIFICATION_SEND_EMAIL:false}
      frontend-base-url: ${APP_NOTIFICATION_VERIFICATION_FRONTEND_BASE_URL:${APP_AUTH_RECOVERY_FRONTEND_BASE_URL:http://localhost:5174}}
      email-subject: ${APP_NOTIFICATION_VERIFICATION_EMAIL_SUBJECT:Verify your email for SkyPanda}
    criteria-created:
      send-email: ${APP_NOTIFICATION_CRITERIA_CREATED_SEND_EMAIL:false}
      email-subject: ${APP_NOTIFICATION_CRITERIA_CREATED_EMAIL_SUBJECT:Your weather alert is active}
    criteria-deleted:
      send-email: ${APP_NOTIFICATION_CRITERIA_DELETED_SEND_EMAIL:false}
      email-subject: ${APP_NOTIFICATION_CRITERIA_DELETED_EMAIL_SUBJECT:Your weather alert was removed}
  auth:
    recovery:
      token-ttl-minutes: ${APP_AUTH_RECOVERY_TOKEN_TTL_MINUTES:15}
      request-cooldown-seconds: ${APP_AUTH_RECOVERY_REQUEST_COOLDOWN_SECONDS:60}
      expose-raw-code: ${APP_AUTH_RECOVERY_EXPOSE_RAW_CODE:false}
      send-email: ${APP_AUTH_RECOVERY_SEND_EMAIL:false}
      frontend-base-url: ${APP_AUTH_RECOVERY_FRONTEND_BASE_URL:http://localhost:5174}
      username-email-subject: ${APP_AUTH_RECOVERY_USERNAME_EMAIL_SUBJECT:Your SkyPanda username}
      password-email-subject: ${APP_AUTH_RECOVERY_PASSWORD_EMAIL_SUBJECT:Reset your SkyPanda password}
      magic-link-email-subject: ${APP_AUTH_RECOVERY_MAGIC_LINK_EMAIL_SUBJECT:Your SkyPanda sign-in link}
    security:
      login:
        max-failures: ${APP_AUTH_SECURITY_LOGIN_MAX_FAILURES:6}
        window-minutes: ${APP_AUTH_SECURITY_LOGIN_WINDOW_MINUTES:15}
        lock-minutes: ${APP_AUTH_SECURITY_LOGIN_LOCK_MINUTES:15}
      recovery:
        request:
          max-per-window: ${APP_AUTH_SECURITY_RECOVERY_REQUEST_MAX_PER_WINDOW:8}
          window-minutes: ${APP_AUTH_SECURITY_RECOVERY_REQUEST_WINDOW_MINUTES:15}
        confirm:
          max-failures: ${APP_AUTH_SECURITY_RECOVERY_CONFIRM_MAX_FAILURES:6}
          window-minutes: ${APP_AUTH_SECURITY_RECOVERY_CONFIRM_WINDOW_MINUTES:15}
          lock-minutes: ${APP_AUTH_SECURITY_RECOVERY_CONFIRM_LOCK_MINUTES:15}
  billing:
    stripe:
      enabled: ${APP_BILLING_STRIPE_ENABLED:false}
      secret-key: ${APP_BILLING_STRIPE_SECRET_KEY:}
      webhook-secret: ${APP_BILLING_STRIPE_WEBHOOK_SECRET:}
      price-id: ${APP_BILLING_STRIPE_PRICE_ID:}
      plus-price-id: ${APP_BILLING_STRIPE_PLUS_PRICE_ID:${APP_BILLING_STRIPE_PRICE_ID:}}
      pro-price-id: ${APP_BILLING_STRIPE_PRO_PRICE_ID:}
      success-url: ${APP_BILLING_STRIPE_SUCCESS_URL:${APP_AUTH_RECOVERY_FRONTEND_BASE_URL:http://localhost:5174}/billing/success?session_id={CHECKOUT_SESSION_ID}}
      cancel-url: ${APP_BILLING_STRIPE_CANCEL_URL:${APP_AUTH_RECOVERY_FRONTEND_BASE_URL:http://localhost:5174}/billing/cancel}
      portal-return-url: ${APP_BILLING_STRIPE_PORTAL_RETURN_URL:${APP_AUTH_RECOVERY_FRONTEND_BASE_URL:http://localhost:5174}/app/account}
